config_version = "0"

exclude_patterns = ["tests/**"]
test_patterns = ["tests/**"]

[smells]
mode = "comment"

[smells.boolean_logic]
threshold = 4

[smells.file_complexity]
threshold = 55

[smells.return_statements]
threshold = 4

[smells.nested_control_flow]
threshold = 4

[smells.function_parameters]
threshold = 5

[smells.function_complexity]
threshold = 5

[smells.identical_code]
threshold = 15

[smells.similar_code]
threshold = 15

[[source]]
name = "default"
default = true

[[plugin]]
name = "bandit"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

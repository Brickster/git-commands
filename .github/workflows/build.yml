# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install qlty
      uses: qltysh/qlty-action/install@a19242102d17e497f437d7466aa01b528537e899 # v2

    - name: Install nox
      run: |
        python -m pip install --upgrade pip
        pip install nox

    - name: Run linter
      run: nox -s quality

    - name: Run type checker
      run: nox -s typecheck

    - name: Add bin to PATH
      run: echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git --version
        git config --global init.defaultBranch main
        git config --global user.email "Brickstertwo@users.noreply.github.com"
        git config --global user.name "Marcus Rosenow"
        # set custom system config file so it can be modified
        touch $GITHUB_WORKSPACE/system_gitconfig
        echo "GIT_CONFIG_SYSTEM=$GITHUB_WORKSPACE/system_gitconfig" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: nox -s tests

    - name: Upload coverage report
      uses: qltysh/qlty-action/coverage@v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.lcov
